<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="oddout.png">
    <title>Odd One Out | NyxApse</title>
    <script src="js/theme.js?v=1.0.0"></script>
    <script src="js/game.js?v=1.0.0"></script>

    <script src="js/config.js?v=1.0.0"></script>
