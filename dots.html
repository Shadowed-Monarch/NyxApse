<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="icon" type="image/png" href="Dots.png">
    <title>Dots Reflex | NyxApse</title>
    <script src="js/theme.js?v=8"></script>
    <script src="js/game.js?v=8"></script>
    <link rel="stylesheet" href="css/dots.css?v=8">
    <link rel="stylesheet" href="css/ui.css?v=8">
</head>
<body>
    <header>
        <a href="index.html" style="text-decoration:none; color:var(--text); font-weight:bold;">← HOME</a>
        <div style="font-weight:bold;">LEVEL <span id="lvl-display">1</span></div>
        <div class="brain-wrap"><span>🧠</span> <span id="total-brains">0</span></div>
    </header>
    <div id="stats-bar">
        <div>Next: <span id="next-num">1</span></div>
        <div>Time: <span id="time">10</span>s</div>
    </div>
    <div id="game-container">
        <div id="btn-container"><h1 id="m-title" style="font-size:2.2rem;"></h1></div>
    </div>
    <button id="main-start-btn" class="game-btn" onclick="game.start()">START GAME</button>
    <script src="js/dots.js?v=8"></script>
</body>
</html>
