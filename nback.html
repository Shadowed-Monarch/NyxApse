<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="nback.png">
    <title>N-Back | NyxApse</title>
    <script src="js/theme.js?v=1.0.0"></script>
    <script src="js/game.js?v=1.0.0"></script>
    <script src="js/shell.js?v=1.0.0"></script>
    <script src="js/config.js?v=1.0.0"></script>
    <script src="js/leaderboard.js?v=1.0.0"></script>
    <link rel="stylesheet" href="css/nback.css?v=1.0.0">
    <link rel="stylesheet" href="css/ui.css?v=1.0.0">
    <link rel="stylesheet" href="css/shell.css?v=1.0.0">
</head>
<body>
    <header>
        <a href="index.html" style="text-decoration:none; color:var(--text); font-weight:bold;">&larr; HOME</a>
        <div style="font-weight:bold;">LEVEL <span id="lvl-display">1</span></div>
        <div class="brain-wrap"><span>🧠</span> <span id="total-brains">0</span></div>
    </header>
    <div id="stats">
        <div>Round: <span id="count">0</span>/<span id="total">0</span></div>
        <div>Same as <b><span id="nval">1</span></b> back</div>
        <div>Mistakes: <span id="miss">0</span>/3</div>
    </div>
    <div id="game-container">
        <div id="grid"></div>
        <div id="btn-container"></div>
    </div>
    <button id="same" class="game-btn" disabled>SAME</button>
    <button id="start-btn" class="game-btn" onclick="game.start()">START</button>
    <script src="js/nback.js?v=1.0.0"></script>
</body>
</html>
