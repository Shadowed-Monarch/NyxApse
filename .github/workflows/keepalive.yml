name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 * * 1,4' # Runs every Monday and Thursday at 06:00 UTC
  workflow_dispatch:      # Allows manual triggers from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY Actions secret."
            exit 1
          fi

          # Remove a trailing slash so the request URL is formed correctly.
          SUPABASE_URL="${SUPABASE_URL%/}"

          curl --silent --show-error --fail \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
