name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          URL=$(echo -n "${{secrets.SUPABASE_URL}}" | tr -d '\n')
          KEY=$(echo -n "${{secrets.SUPABASE_ANON_KEY}}" | tr -d '\n')
          curl -sS --fail -X GET "${URL}/rest/v1/" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}"   
